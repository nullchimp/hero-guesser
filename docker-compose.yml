services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hero_guesser}
      MYSQL_USER: ${MYSQL_USER:-hero}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hero_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hero_root_password}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"
    volumes:
      - hero-guesser-mysql:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CODEX_WORKSPACE: ${CODEX_WORKSPACE:-/workspace/codex-workspace}
      DATABASE_URL: ${DATABASE_URL:-mysql://hero:hero_password@mysql:3306/hero_guesser}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.3-codex}
      MODEL_ALLOWLIST: ${MODEL_ALLOWLIST:-gpt-5.3-codex,gpt-5.4,gpt-5.4-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: 3000
      WIKIPEDIA_USER_AGENT: ${WIKIPEDIA_USER_AGENT:-HeroGuesser/0.1 (https://github.com/nullchimp/hero-guesser)}
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  test:
    image: node:24-bookworm-slim
    profiles:
      - test
    working_dir: /workspace
    environment:
      DATABASE_URL: mysql://hero:hero_password@mysql:3306/hero_guesser
    volumes:
      - .:/workspace
      - hero-guesser-test-node-modules:/workspace/node_modules
    command: >
      sh -c "npm ci &&
      npm run prisma:generate -w @hero-guesser/api &&
      npm run lint &&
      npm run typecheck &&
      npm test"

volumes:
  hero-guesser-mysql:
  hero-guesser-test-node-modules:
